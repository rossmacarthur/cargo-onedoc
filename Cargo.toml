[package]
name = "cargo-onedoc"
version = "0.3.2"
authors = ["Ross MacArthur <ross@macarthur.io>"]
edition = "2024"
description = "Generate your README.md from Rust doc comments"
readme = "README.md"
repository = "https://github.com/rossmacarthur/cargo-onedoc"
license = "MIT OR Apache-2.0"
keywords = ["readme", "markdown", "documentation", "cargo"]
categories = ["development-tools::cargo-plugins"]
include = ["src/**/*", "LICENSE-*", "README.md"]

[dependencies]
anyhow = "1.0.86"
camino = "1.1.7"
cargo_metadata = "0.21.0"
casual = "0.2.0"
constcat = "0.6.0"
proc-macro2 = "1.0.95"
pulldown-cmark = "0.13.0"
pulldown-cmark-to-cmark = "21.0.0"
pulldown-cmark-toc = "0.7.0"
regex-macro = "0.3.0"
semver = "1.0.26"
serde = { version = "1.0.219", features = ["derive"] }
syn = { version = "2.0.104", features = ["full"] }
toml = "0.8.23"
upon = "0.10.0"

[dependencies.clap]
version = "4.5.8"
default-features = false
features = [
    "std", "help", "usage", "error-context", "suggestions", # default excluding "color"
    "cargo", "env", "derive"                                # optional
]

[dev-dependencies]
pretty_assertions = "1.4.1"
